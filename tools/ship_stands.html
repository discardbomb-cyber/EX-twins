<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корабельные щиты — студия</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1017;color:#e7edf6;font:15px system-ui}header,main,footer{max-width:1480px;margin:auto;padding:24px}header{padding-bottom:12px}h1{font-size:26px;margin:0 0 8px}header p,footer{color:#9caabd}button,select{font:inherit;color:inherit;background:#202b3a;border:1px solid #39465a;border-radius:8px;padding:9px 14px;cursor:pointer}button:hover{background:#304055}button:focus-visible{outline:2px solid #88d7ff}button[aria-pressed=true]{border-color:var(--accent,#78ceff);background:#283d50}.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:20px;padding:16px;background:#151d29;border-radius:12px}.toolbar label{display:flex;gap:8px;align-items:center}input{accent-color:#84cfff}#seek{width:200px}#volume{width:90px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}article{border:1px solid #2b3749;border-top:3px solid var(--accent);background:#151c27;border-radius:14px;overflow:hidden}.title{display:flex;align-items:center;justify-content:space-between;padding:18px}h2{margin:0;color:var(--accent);font-size:20px}.badge{font-size:12px;color:#a4b2c7}canvas{display:block;width:100%;aspect-ratio:1;background:#161a20}.actions{display:flex;gap:8px;padding:16px 16px 8px}.actions button{flex:1;padding:9px 5px}.previews{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}.preview{padding:0;border-radius:9px;overflow:hidden;text-align:left}.preview img{width:100%;display:block;aspect-ratio:1;object-fit:contain;background:#161a20}.preview span{display:block;padding:8px 10px;font-size:13px}.description{padding:0 18px;color:#a2b1c5;min-height:42px;font-size:13px}.zoom{margin:4px 16px 16px;width:calc(100% - 32px)}footer{padding-top:0;font-size:12px}dialog{background:#151c27;color:#e7edf6;border:1px solid #526179;border-radius:14px;max-width:min(850px,95vw);width:850px;padding:20px}dialog::backdrop{background:#000b}dialog canvas{max-height:75vh;object-fit:contain}dialog header{padding:0;display:flex;justify-content:space-between;align-items:center}dialog h2{color:#e7edf6}@media(max-width:950px){main{grid-template-columns:1fr}article{max-width:640px;width:100%;margin:auto}.previews{grid-template-columns:1fr 1fr}.toolbar{gap:10px}header,main{padding:16px}}
</style>
<header><h1>Корабельные щиты</h1><p>Превью, переходы состояний и звук для каждой ветки.</p><div class="toolbar">
<button id="play">Пауза</button><label>Скорость <select id="speed"><option value=".5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
<label>Кадр <input id="seek" type="range" min="0" max="47" value="0"></label><button id="sound" aria-pressed="false">Включить звук</button><label>Громкость <input id="volume" type="range" min="0" max="100" value="25"></label><label><input id="fx" type="checkbox" checked> Эффекты</label>
</div></header><main></main><footer>Автономные стенды без запуска Minecraft. Свечение, поле и синтезированный звук демонстрируют оформление; игровой рендер и Photon здесь не проверяются.</footer>
<dialog id="large"><header><h2 id="large-title"></h2><button id="close">Закрыть</button></header><canvas id="large-canvas" width="480" height="480"></canvas></dialog>
<script>
const count=COUNT, definitions=[['rf','RF','#52c4ff','Шесть пластин раскрываются и собираются в шар. Индукционный гул и механический запуск.'],['mana','Mana','#48e2ff','Поочерёдное раскрытие лепестков, левитация и вращение ядра. Звонкие резонансы.'],['twins','Ex-Twins','#d478ff','Независимые сферы с порталами и широкими орбитами. Низкий пульсирующий гул.']];
const states={}, main=document.querySelector('main');let frame=0,playing=true,previous=0,selected=null,audio=null,master=null,soundOn=false;
for(const [key,title,colour,description] of definitions){
 const card=document.createElement('article');card.style.setProperty('--accent',colour);card.innerHTML=`<div class="title"><h2>${title}</h2><span class="badge">Активный цикл</span></div><canvas width="480" height="480" aria-label="Превью ${title}"></canvas><div class="actions"><button data-mode="active" aria-pressed="true">Активный</button><button data-mode="inactive" aria-pressed="false">Неактивный</button></div><div class="previews"><button class="preview" data-mode="active"><img src="${key}.png" alt="Активный ${title}"><span>Активный вариант</span></button><button class="preview" data-mode="inactive"><img src="${key}/inactive.png" alt="Неактивный ${title}"><span>Неактивный вариант</span></button></div><p class="description">${description}</p><button class="zoom">Крупное превью</button>`;main.append(card);
 const image=src=>{const i=new Image();i.src=src;return i};const state=states[key]={key,title,colour,card,canvas:card.querySelector('canvas'),mode:'active',transition:null,offset:0,activeFrames:Array.from({length:count},(_,i)=>image(key+'/active/'+String(i).padStart(3,'0')+'.png')),frames:Array.from({length:count},(_,i)=>image(key+'/'+String(i).padStart(3,'0')+'.png')),openingFrames:key==='twins'?Array.from({length:count},(_,i)=>image(key+'/opening/'+String(i).padStart(3,'0')+'.png')):null,closingFrames:key==='twins'?Array.from({length:count},(_,i)=>image(key+'/closing/'+String(i).padStart(3,'0')+'.png')):null,inactive:image(key+'/inactive.png'),gain:null,index:0,power:0};
 card.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>switchMode(state,button.dataset.mode));card.querySelector('.zoom').onclick=()=>{selected=state;document.querySelector('#large-title').textContent=title;document.querySelector('#large').showModal()};
}
function switchMode(state,mode){if(state.mode===mode&&!state.transition)return;state.mode=mode;state.transition={elapsed:0,from:state.key==='twins'?0:mode==='active'?0:Math.floor(count*.78),to:state.key==='twins'?count-1:mode==='active'?Math.ceil(count*.22):count-1};state.card.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));playing=true;document.querySelector('#play').textContent='Пауза';chime(state.key,mode==='active')}
function setupAudio(){audio=new AudioContext();master=audio.createGain();master.gain.value=0;master.connect(audio.destination);definitions.forEach(([key])=>{const osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();osc.type=key==='rf'?'sawtooth':'sine';osc.frequency.value=key==='rf'?58:key==='mana'?220:42;filter.type='lowpass';filter.frequency.value=key==='rf'?280:800;gain.gain.value=0;osc.connect(filter);filter.connect(gain);gain.connect(master);osc.start();states[key].gain=gain})}
function chime(key,on){if(!soundOn||!audio)return;const base=key==='rf'?95:key==='mana'?440:70,now=audio.currentTime;for(let k=0;k<3;k++){const osc=audio.createOscillator(),gain=audio.createGain();osc.type=key==='rf'?'triangle':'sine';osc.frequency.setValueAtTime(base*(1+k*.5)*(on?.5:2),now);osc.frequency.exponentialRampToValueAtTime(base*(1+k*.5)*(on?2:.4),now+.8);gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.08/(k+1),now+.04);gain.gain.exponentialRampToValueAtTime(.0001,now+1.2);osc.connect(gain);gain.connect(master);osc.start(now);osc.stop(now+1.3)}}
document.querySelector('#sound').onclick=async()=>{if(!audio)setupAudio();await audio.resume();soundOn=!soundOn;document.querySelector('#sound').setAttribute('aria-pressed',soundOn);document.querySelector('#sound').textContent=soundOn?'Выключить звук':'Включить звук';if(soundOn)definitions.forEach(([key])=>chime(key,true))};
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Пауза':'Продолжить'};document.querySelector('#seek').oninput=e=>{frame=+e.target.value;playing=false;document.querySelector('#play').textContent='Продолжить';Object.values(states).forEach(s=>{s.offset=0;s.transition=null})};document.querySelector('#close').onclick=()=>document.querySelector('#large').close();
function draw(now){const delta=previous?Math.min(.1,(now-previous)/1000):0;previous=now;const step=delta*8*+document.querySelector('#speed').value;if(playing)frame=(frame+step)%count;document.querySelector('#seek').value=Math.floor(frame);
 for(const state of Object.values(states)){let index=Math.floor((frame+state.offset+count)%count),transition=state.transition;if(transition){if(playing)transition.elapsed+=step;index=Math.min(transition.to,transition.from+Math.floor(transition.elapsed));if(index===transition.to){if(state.mode==='active')state.offset=(state.key==='twins'?count/2:index*count/(count-1))-frame;state.transition=null}}
 const active=state.mode==='active'||!!transition,phase=index/(count-1),ramp=Math.max(0,Math.min(1,phase/.22,(1-phase)/.22)),power=active?(transition?(state.key==='twins'?(state.mode==='active'?phase:1-phase):ramp*ramp*(3-2*ramp)):1):0;state.power=power;state.index=index;
 state.card.querySelector('.badge').textContent=transition?(state.mode==='active'?'Включение':'Выключение'):active?'Активный цикл':'Неактивный';const x=state.canvas.getContext('2d'),im=active?(transition?(state.key==='twins'?(state.mode==='active'?state.openingFrames[index]:state.closingFrames[index]):state.frames[index]):state.activeFrames[index]):state.inactive;x.fillStyle='#161a20';x.fillRect(0,0,480,480);if(im.complete&&im.naturalWidth)x.drawImage(im,0,0);
 if(document.querySelector('#fx').checked&&power>.01){x.save();x.globalCompositeOperation='screen';x.strokeStyle=state.colour;x.globalAlpha=.12*power;x.lineWidth=1;for(let k=0;k<3;k++){x.beginPath();x.ellipse(240,245,145+k*8,180+k*5,0,0,Math.PI*2);x.stroke()}x.restore()}
 if(audio&&state.gain)state.gain.gain.setTargetAtTime(playing?power*(state.key==='rf'?.045:.07)*(.85+.15*Math.sin(now*.003)):0,audio.currentTime,.05);
 }
 if(master)master.gain.setTargetAtTime(soundOn?+document.querySelector('#volume').value/100:0,audio.currentTime,.05);if(selected&&document.querySelector('#large').open)document.querySelector('#large-canvas').getContext('2d').drawImage(selected.canvas,0,0);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
