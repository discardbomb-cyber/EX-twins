modLoader="javafml"
loaderVersion="[4,)"
license="All Rights Reserved"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="required"
versionRange="[9.3.1+1.21.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="photon"
type="required"
versionRange="[${photon_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ldlib2"
type="required"
versionRange="[${ldlib2_version},)"
ordering="AFTER"
side="BOTH"

# Core Mekanism is required by the crafting progression on both client and server.
[[dependencies.${mod_id}]]
modId="mekanism"
type="required"
versionRange="[${mekanism_min_version},10.8)"
ordering="AFTER"
side="BOTH"

# Mana crafting requires Iron's Spells on both client and server.
[[dependencies.${mod_id}]]
modId="irons_spellbooks"
type="required"
versionRange="[${irons_spellbooks_min_version},1.21.2)"
ordering="AFTER"
side="BOTH"

# Optional: with LambDynamicLights installed, shields, swarm effects and blasts light up the world.
[[dependencies.${mod_id}]]
modId="lambdynlights_api"
type="optional"
versionRange="[4.0.0,)"
ordering="NONE"
side="CLIENT"

# LambDynamicLights loads this class itself; nothing else in the mod refers to its package.
[modproperties.${mod_id}."yumi:entrypoints"]
"lambdynlights:initializer"="dev.hurtify.relicsaddon.client.light.DynamicLightsBridge"
