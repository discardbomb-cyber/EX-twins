<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EX-twins — микшер звуков</title>
<style>body{font:16px system-ui;background:#14111d;color:#eee;max-width:1100px;margin:30px auto;padding:20px}button,input{font:inherit}button{padding:8px;margin:4px;background:#453166;color:white;border:1px solid #8561ba;border-radius:6px}label{display:inline-block;margin:8px}article{border:1px solid #554268;border-radius:10px;padding:14px;margin:12px 0}h2{font-size:17px;overflow-wrap:anywhere}input[type=number]{width:80px}output{font-variant-numeric:tabular-nums}#status{min-height:24px;color:#d9c0ff}</style>
<h1>EX-twins — прослушивание и микшер</h1>
<p>Добавьте WAV/OGG. Файлы остаются в браузере. Задержка задаёт начало фазы в общем миксе; Loop повторяет дорожку. Экспорт и пространственное звучание здесь не моделируются.</p>
<input id="files" type="file" accept="audio/*,.ogg,.wav" multiple>
<div><button id="play">Играть микс</button><button id="stop">Стоп</button><button id="save">Скачать параметры</button>
<label>Общая громкость <input id="master" type="range" min="0" max="1" step=".01" value=".7"></label>
<output id="peak">Пик: —</output></div><p id="status" role="status"></p><div id="tracks"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let ctx,master,analyser;const tracks=[];let playing=false,auditionTrack=null;
function init(){if(ctx)return;ctx=new AudioContext();master=ctx.createGain();master.gain.value=+$('master').value;analyser=ctx.createAnalyser();analyser.fftSize=2048;master.connect(analyser);analyser.connect(ctx.destination);const pcm=new Float32Array(analyser.fftSize);function meter(){analyser.getFloatTimeDomainData(pcm);let p=0;for(const x of pcm)p=Math.max(p,Math.abs(x));$('peak').textContent='Пик: '+(p? (20*Math.log10(p)).toFixed(1)+' dBFS':'—')+(p>=1?' — перегрузка':'');requestAnimationFrame(meter)}meter()}
function stop(){for(const t of tracks){if(t.source){try{t.source.stop()}catch{}t.source.disconnect();t.source=null}if(t.gain){t.gain.disconnect();t.gain=null}}playing=false;$('status').textContent='Остановлено'}
function levels(){const solo=tracks.some(t=>t.solo);for(const t of tracks)if(t.gain)t.gain.gain.setTargetAtTime((auditionTrack?t!==auditionTrack:t.mute||(solo&&!t.solo))?0:t.volume,ctx.currentTime,.01)}
async function play(only){init();await ctx.resume();stop();auditionTrack=only||null;const start=ctx.currentTime+.05;let remaining=0;playing=true;for(const t of tracks){if(only&&t!==only)continue;const source=ctx.createBufferSource(),gain=ctx.createGain();source.buffer=t.buffer;source.loop=t.loop;source.connect(gain);gain.connect(master);t.source=source;t.gain=gain;remaining++;source.onended=()=>{if(t.source!==source)return;source.disconnect();gain.disconnect();t.source=null;t.gain=null;if(--remaining===0){playing=false;$('status').textContent='Воспроизведение завершено'}};source.start(start+(only?0:t.delay))}levels();$('status').textContent=remaining?'Воспроизведение':'Добавьте звуки'}
$('files').onchange=async e=>{init();for(const file of e.target.files){try{const buffer=await ctx.decodeAudioData(await file.arrayBuffer());const t={name:file.name,buffer,volume:.7,delay:0,loop:false,mute:false,solo:false,source:null,gain:null};tracks.push(t);const card=document.createElement('article'),title=document.createElement('h2');title.textContent=file.name+' · '+buffer.duration.toFixed(2)+' с · '+buffer.numberOfChannels+' кан.';card.append(title);function check(text,key){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.onchange=()=>{t[key]=input.checked;if(key==='loop'&&t.source)t.source.loop=t.loop;levels()};label.append(input,document.createTextNode(' '+text));card.append(label)}check('Mute','mute');check('Solo','solo');check('Loop','loop');const label=document.createElement('label'),slider=document.createElement('input'),value=document.createElement('output');label.textContent='Громкость ';slider.type='range';slider.min=0;slider.max=1;slider.step=.01;slider.value=t.volume;value.textContent=' '+t.volume;slider.oninput=()=>{t.volume=+slider.value;value.textContent=' '+t.volume;levels()};label.append(slider,value);card.append(label);const delayLabel=document.createElement('label'),delay=document.createElement('input');delayLabel.textContent='Старт, с ';delay.type='number';delay.min=0;delay.max=600;delay.step=.05;delay.value=0;delay.onchange=()=>{t.delay=Math.max(0,Math.min(600,Number(delay.value)||0));delay.value=t.delay};delayLabel.append(delay);card.append(delayLabel);const audition=document.createElement('button');audition.textContent='Слушать отдельно';audition.onclick=()=>play(t).catch(err=>$('status').textContent=err.message);card.append(audition);$('tracks').append(card);$('status').textContent='Загружено дорожек: '+tracks.length}catch(err){$('status').textContent='Не удалось прочитать '+file.name+': '+err.message}}e.target.value=''};
$('play').onclick=()=>play().catch(err=>$('status').textContent=err.message);$('stop').onclick=stop;$('master').oninput=()=>{if(master)master.gain.gain.setTargetAtTime(+$('master').value,ctx.currentTime,.01)};
$('save').onclick=()=>{const data={master:+$('master').value,tracks:tracks.map(t=>({file:t.name,volume:t.volume,delaySeconds:t.delay,loop:t.loop,mute:t.mute,solo:t.solo}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='mix-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
