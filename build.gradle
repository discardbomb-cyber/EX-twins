plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    releaseProbe
    // These probes exercise Relics' old native UI and data API. They are retained
    // as migration reference, but are not part of the standalone build.
    main {
        java.exclude 'dev/hurtify/relicsaddon/gametest/**'
    }
}

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.releaseProbe)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        visualTestClient {
            client()
            gameDirectory = file('run-visual')
            systemProperty 'relics_addon.interactiveSmoke', 'true'
            systemProperty 'relics_addon.visualSmoke', 'false'
            systemProperty 'relics_addon.shieldSmoke', 'false'
            systemProperty 'relics_addon.captureAndExit', 'false'
            systemProperty 'relics_addon.cellSmoke', 'false'
        }

        startupCheckClient {
            client()
            gameDirectory = file('run-verification')
            systemProperty 'relics_addon.startupSmoke', 'true'
            systemProperty 'relics_addon.visualSmoke', 'false'
            systemProperty 'relics_addon.shieldSmoke', 'false'
            systemProperty 'relics_addon.captureAndExit', 'false'
            systemProperty 'relics_addon.cellSmoke', 'false'
        }

        releaseCheckClient {
            client()
            sourceSet = sourceSets.releaseProbe
            gameDirectory = file('run-release-check')
            loadedMods = []
        }

        shieldCaptureClient {
            client()
            gameDirectory = file('run-verification')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.shieldSmoke', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
            systemProperty 'relics_addon.cellSmoke', 'true'
        }

        researchCaptureClient {
            client()
            gameDirectory = file('run-verification')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.researchSmoke', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        uiCaptureClient {
            client()
            gameDirectory = file('run-ui-capture')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.uiSmoke', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        hiveCaptureClient {
            client()
            gameDirectory = file('run-verification')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.hiveSmoke', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        hiveGifClient {
            client()
            gameDirectory = file('run-hive-gif')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.hiveSmoke', 'true'
            systemProperty 'relics_addon.hiveGif', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        featureGifClient {
            client()
            gameDirectory = file('run-feature-gif')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.shieldSmoke', 'true'
            systemProperty 'relics_addon.cellSmoke', 'true'
            systemProperty 'relics_addon.featureGif', 'true'
            systemProperty 'relics_addon.hiveGif', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        modelCaptureClient {
            client()
            gameDirectory = file('run-verification')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        release_probe {
            sourceSet(sourceSets.releaseProbe)
        }
    }
    runs.releaseCheckClient.loadedMods = [mods.release_probe]
    runs.configureEach {
        if (name != 'releaseCheckClient') loadedMods = [mods.getByName(mod_id)]
    }
}

def localProperties = new Properties()
if (file('gradle.local.properties').isFile()) {
    file('gradle.local.properties').withInputStream { localProperties.load(it) }
}
def requiredJar = { String propertyName, String displayName, String filename ->
    def raw = providers.gradleProperty(propertyName).orNull ?: localProperties.getProperty(propertyName) ?: "libs/${filename}"

    def jar = file(raw)
    if (!jar.isFile()) {
        throw new GradleException("${displayName} jar not found: ${jar}. Put it in libs/ or set ${propertyName} in gradle.local.properties.")
    }

    jar
}

dependencies {
    testImplementation 'com.google.code.gson:gson:2.10.1'
    implementation files(requiredJar('curiosJar', 'Curios 9.5.1+1.21.1', 'curios-neoforge-9.5.1+1.21.1.jar'))
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

configurations.releaseProbeRuntimeClasspath.extendsFrom(configurations.implementation)

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('verifyShieldMesh', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.hurtify.relicsaddon.client.ShieldHexMeshCheck'
    args layout.buildDirectory.file('reports/shield-geometry.json').get().asFile.absolutePath
}

tasks.named('check') {
    dependsOn tasks.named('verifyShieldMesh')
    dependsOn 'verifyRelicAnimation'
    dependsOn 'verifyTwinsFacets'
    dependsOn 'verifyTwinsGlyphs'
    dependsOn 'verifyShieldImpact'
    dependsOn 'verifyHiveFormation'
    dependsOn 'verifyHiveLayers'
    dependsOn 'verifyManaDome'
    dependsOn 'verifyReleaseContents'
}

tasks.register('verifyManaDome', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + tasks.named('compileJava').get().classpath
    mainClass = 'dev.hurtify.relicsaddon.client.ManaDomeSurfaceCheck'
}

tasks.register('verifyHiveLayers', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.hurtify.relicsaddon.client.HiveLayerAnimationCheck'
}

tasks.register('verifyHiveFormation', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + tasks.named('compileJava').get().classpath
    mainClass = 'dev.hurtify.relicsaddon.client.HiveFormationCheck'
}

tasks.named('compileTestJava', JavaCompile) {
    classpath += tasks.named('compileJava').get().classpath
}

tasks.register('verifyShieldImpact', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.hurtify.relicsaddon.client.ShieldImpactPulseCheck'
}

tasks.register('verifyTwinsGlyphs', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.hurtify.relicsaddon.client.TwinsShieldGlyphMeshCheck'
}

tasks.register('inspectShieldSave', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath + tasks.named('compileJava').get().classpath
    mainClass = 'dev.hurtify.relicsaddon.gametest.ShieldSaveDiagnostic'
    if (providers.gradleProperty('shieldSave').isPresent()) {
        args providers.gradleProperty('shieldSave').get()
    }
}

// NeoForge can exit zero after a loading error, before running any tests.
tasks.named('runGameTestServer').configure {
    doFirst { ext.testStartedMillis = System.currentTimeMillis() }
    doLast {
        def log = file('run-gametest/logs/latest.log')
        if (!log.exists() || log.lastModified() < ext.testStartedMillis ||
                !(log.getText('UTF-8') =~ /All \d+ required tests passed/).find()) {
            throw new GradleException('GameTest server did not confirm a fresh successful test run; inspect run-gametest/logs/latest.log')
        }
    }
}

// Development-only tests are discoverable by GameTest, but never shipped in the mod jar.
tasks.named('jar') {
    exclude 'dev/hurtify/relicsaddon/gametest/**'
    exclude 'data/relics_addon/structure/test_room.nbt'
    exclude 'data/relics_addon/structure/field_arena.nbt'
}

tasks.register('verifyReleaseContents') {
    dependsOn tasks.named('jar')
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            sourceSets.main.output.classesDirs.each { root ->
                fileTree(root).matching {
                    include '**/*.class'
                    exclude 'dev/hurtify/relicsaddon/gametest/**'
                }.each { compiled ->
                    def entry = root.toPath().relativize(compiled.toPath()).toString().replace('\\', '/')
                    if (zip.getEntry(entry) == null) throw new GradleException("Missing release class: ${entry}")
                }
            }
            if (zip.entries().any { it.name.startsWith('dev/hurtify/relicsaddon/gametest/') }) {
                throw new GradleException('Development preview/test classes leaked into the release jar')
            }
        }
    }
}

tasks.register('stageReleaseCheck', Sync) {
    dependsOn tasks.named('verifyReleaseContents')
    from tasks.named('jar').flatMap { it.archiveFile }
    into layout.projectDirectory.dir('run-release-check/mods')
}

tasks.named('runReleaseCheckClient').configure {
    dependsOn tasks.named('stageReleaseCheck')
    doFirst { ext.testStartedMillis = System.currentTimeMillis() }
    doLast {
        def log = file('run-release-check/logs/latest.log')
        if (!log.exists() || log.lastModified() < ext.testStartedMillis ||
                !log.getText('UTF-8').contains('Packaged release verified: TitleScreen, no preview')) {
            throw new GradleException('Packaged release did not reach the ordinary title screen')
        }
    }
}

tasks.register('verifyRelicAnimation', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.hurtify.relicsaddon.client.RelicAnimationPoseCheck'
    args layout.buildDirectory.file('reports/animation-poses.json').get().asFile.absolutePath
}

tasks.register('verifyTwinsFacets', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.hurtify.relicsaddon.client.TwinsFacetPoseCheck'
    args layout.buildDirectory.file('reports/twins-facet-poses.json').get().asFile.absolutePath
}
