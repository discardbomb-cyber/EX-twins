plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    // LambDynamicLights is optional: compiled against, and loaded only by the development clients below.
    dynamicLightsRuntime {
        canBeConsumed = false
        canBeResolved = true
        attributes { attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME)) }
    }
    // Create Aeronautics (Sable, Create, Create Big Cannons, CC: Tweaked) is optional too: the mod compiles against it
    // and only the aeronauticsClient run below loads it. See docs/aeronautics-compat.md.
    aeronauticsRuntime {
        canBeConsumed = false
        canBeResolved = true
        attributes { attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME)) }
    }
}

sourceSets {
    releaseProbe
    // GameTests under gametest/** compile with the mod and run with runGameTestServer;
    // the jar task below keeps them out of release jars.
}

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.releaseProbe)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        visualTestClient {
            client()
            gameDirectory = file('run-visual')
            systemProperty 'relics_addon.interactiveSmoke', 'true'
            systemProperty 'relics_addon.visualSmoke', 'false'
            systemProperty 'relics_addon.shieldSmoke', 'false'
            systemProperty 'relics_addon.captureAndExit', 'false'
            systemProperty 'relics_addon.cellSmoke', 'false'
        }

        startupCheckClient {
            client()
            gameDirectory = file('run-verification')
            systemProperty 'relics_addon.startupSmoke', 'true'
            systemProperty 'relics_addon.visualSmoke', 'false'
            systemProperty 'relics_addon.shieldSmoke', 'false'
            systemProperty 'relics_addon.captureAndExit', 'false'
            systemProperty 'relics_addon.cellSmoke', 'false'
        }

        releaseCheckClient {
            client()
            sourceSet = sourceSets.releaseProbe
            gameDirectory = file('run-release-check')
            loadedMods = []
        }

        shieldCaptureClient {
            client()
            gameDirectory = file('run-verification')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.shieldSmoke', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
            systemProperty 'relics_addon.cellSmoke', 'true'
        }

        researchCaptureClient {
            client()
            gameDirectory = file('run-verification')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.researchSmoke', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        uiCaptureClient {
            client()
            gameDirectory = file('run-ui-capture')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.uiSmoke', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        hiveCaptureClient {
            client()
            gameDirectory = file('run-verification')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.hiveSmoke', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        hiveGifClient {
            client()
            gameDirectory = file('run-hive-gif')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.hiveSmoke', 'true'
            systemProperty 'relics_addon.hiveGif', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        // Scripted fights in a real world, filmed from a side camera (gametest.client.WorldScenarios). The run
        // directory needs options.txt and a superflat world with cheats in saves/Scenario.
        worldScenarioClient {
            client()
            gameDirectory = file('run-scenario')
            programArgument '--quickPlaySingleplayer'
            programArgument 'Scenario'
            systemProperty 'relics_addon.worldScenario', providers.gradleProperty('scenario').getOrElse('all')
        }

        // Ship hive scenes on a real Sable ship: run-ship/mods holds Sable's jar (copied from the Gradle cache), so
        // only these runs load it.
        shipScenarioClient {
            client()
            gameDirectory = file('run-ship')
            programArgument '--quickPlaySingleplayer'
            programArgument 'Scenario'
            systemProperty 'relics_addon.worldScenario', providers.gradleProperty('scenario').getOrElse('ship-sable')
        }

        featureGifClient {
            client()
            gameDirectory = file('run-feature-gif')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.shieldSmoke', 'true'
            systemProperty 'relics_addon.cellSmoke', 'true'
            systemProperty 'relics_addon.featureGif', 'true'
            systemProperty 'relics_addon.hiveGif', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        modelCaptureClient {
            client()
            gameDirectory = file('run-verification')
            systemProperty 'relics_addon.visualSmoke', 'true'
            systemProperty 'relics_addon.captureAndExit', 'true'
        }

        // Development client with Create Aeronautics, Sable, Create, Create Big Cannons and CC: Tweaked on the
        // classpath (ship shields on real airships). The run directory needs options.txt like the others.
        aeronauticsClient {
            client()
            gameDirectory = file('run-aeronautics')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // -PaeroWorld=<save name> opens that world straight away (copy saves/<name> in first).
            if (providers.gradleProperty('aeroWorld').isPresent()) {
                programArgument '--quickPlaySingleplayer'
                programArgument providers.gradleProperty('aeroWorld').get()
            }
            // -Pscenario=<names> films WorldScenarios scenes in that world, as worldScenarioClient does.
            if (providers.gradleProperty('scenario').isPresent()) {
                systemProperty 'relics_addon.worldScenario', providers.gradleProperty('scenario').get()
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        release_probe {
            sourceSet(sourceSets.releaseProbe)
        }
    }
    runs.releaseCheckClient.loadedMods = [mods.release_probe]
    runs.configureEach {
        if (name != 'releaseCheckClient') loadedMods = [mods.getByName(mod_id)]
        // Servers and the packaged-jar check run without it, so they prove the mod never needs it.
        // FML finds development mods on the JVM classpath; the run's additionalRuntimeClasspath would make
        // it a boot-layer library that mod discovery then skips as already located.
        if (type.get() == 'client' && name != 'releaseCheckClient') {
            def runTask = "run${name.capitalize()}"
            tasks.matching { it.name == runTask }.configureEach { classpathProvider.from(configurations.dynamicLightsRuntime) }
        }
        if (name == 'aeronauticsClient') {
            tasks.matching { it.name == 'runAeronauticsClient' }.configureEach { classpathProvider.from(configurations.aeronauticsRuntime) }
        }
    }
}

repositories {
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
        content { includeGroup "top.theillusivec4.curios" }
    }
    maven {
        name = "LowDragMC"
        url = "https://maven.firstdark.dev/snapshots"
        content { includeGroupByRegex 'com\\.lowdragmc.*' }
    }
    maven {
        name = "Gegy"
        url = "https://maven.gegy.dev/releases/"
        content { includeGroup "dev.lambdaurora.lambdynamiclights" }
    }
    maven {
        name = "RyanHCode"
        url = "https://maven.ryanhcode.dev/releases"
        content {
            includeGroup "dev.ryanhcode.sable-companion"
            includeGroup "dev.ryanhcode.sable"
        }
    }
    // Sable's complete jar (Veil and the Rapier natives nested), Create Aeronautics (bundled jar), Create Big Cannons
    // and Ritchie's Projectile Lib, for the aeronauticsClient run.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
        content { includeGroup "com.simibubi.create" }
    }
    maven {
        name = "SquidDev"
        url = "https://maven.squiddev.cc"
        content { includeGroup "cc.tweaked" }
    }
}

// LambDynamicLights publishes Fabric (intermediary), NeoForge (mojmap) and a shadowed dev jar side by side;
// only the unshadowed mojmap variant carries the nested jars NeoForge needs.
def mappingsAttribute = Attribute.of('net.minecraft.mappings', String)
def neoForgeVariant = { AttributeContainer attributes ->
    attributes.attribute(mappingsAttribute, 'mojmap')
    attributes.attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
}

dependencies {
    attributesSchema { attribute(mappingsAttribute) }
    testImplementation 'com.google.code.gson:gson:2.10.1'
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation("com.lowdragmc.photon:photon-neoforge-1.21.1:${photon_version}:all") { transitive = false }
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:${ldlib2_version}:all"
    implementation "com.lowdragmc.kilagraph:kilagraph-neoforge-1.21.1:${kilagraph_version}"
    compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${lambdynamiclights_version}") {
        attributes(neoForgeVariant)
        transitive = false
    }
    // The runtime jar nests its API, SpruceUI, Pridelib and Yumi, which FML unpacks itself.
    dynamicLightsRuntime("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:${lambdynamiclights_version}") {
        attributes(neoForgeVariant)
        transitive = false
    }

    // Ships of Create Aeronautics are Sable physics bodies. Sable's companion library (MIT) finds the ship a block is on and
    // where that ship is: bundled, and a harmless no-op where Sable is not installed.
    jarJar(implementation("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:[${sable_companion_version},)")) {
        version { prefer sable_companion_version }
    }
    // Sable itself only to compile the few calls made when it is installed (a ship's exact bounds).
    compileOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:${sable_version}") { transitive = false }
    // The rest of the airship compatibility (compat/aeronautics), compiled against but never required at runtime.
    compileOnly("com.simibubi.create:create-1.21.1:${create_version}") { transitive = false }
    compileOnly("maven.modrinth:create-big-cannons:${cbc_version}") { transitive = false }
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-forge-api:${cct_version}") { transitive = false }
    // The Sable jar nests Sable Companion, Veil and the Rapier natives; Create nests Flywheel, Ponder and Registrate.
    aeronauticsRuntime("maven.modrinth:sable:${sable_version}+mc1.21.1") { transitive = false }
    aeronauticsRuntime("com.simibubi.create:create-1.21.1:${create_version}") { transitive = false }
    aeronauticsRuntime("maven.modrinth:create-aeronautics:${aeronautics_version}") { transitive = false }
    aeronauticsRuntime("maven.modrinth:create-big-cannons:${cbc_version}") { transitive = false }
    aeronauticsRuntime("maven.modrinth:rpl:${rpl_version}") { transitive = false }
    aeronauticsRuntime("cc.tweaked:cc-tweaked-1.21.1-forge:${cct_version}") { transitive = false }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description,
            curios_version   : curios_version,
            photon_version   : photon_version,
            ldlib2_version   : ldlib2_version,
            kilagraph_version: kilagraph_version,
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

configurations.releaseProbeRuntimeClasspath.extendsFrom(configurations.implementation)

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('verifyShieldMesh', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.hurtify.relicsaddon.client.ShieldHexMeshCheck'
    args layout.buildDirectory.file('reports/shield-geometry.json').get().asFile.absolutePath
}

tasks.named('check') {
    dependsOn tasks.named('verifyShieldMesh')
    dependsOn 'verifyRelicAnimation'
    dependsOn 'verifyTwinsFacets'
    dependsOn 'verifyShieldImpact'
    dependsOn 'verifyShieldRipple'
    dependsOn 'verifyShieldShell'
    dependsOn 'verifyDevicePower'
    dependsOn 'verifyNetworkCodecs'
    dependsOn 'verifyRegistryFilter'
    dependsOn 'verifyHiveFormation'
    dependsOn 'verifyHiveAllocation'
    dependsOn 'verifyHiveConstructs'
    dependsOn 'verifyArmageddonSounds'
    dependsOn 'verifyHiveLayers'
    dependsOn 'verifyEffectLights'
    dependsOn 'verifyEffectLightSources'
    dependsOn 'verifyReleaseContents'
    dependsOn 'verifyObjCompact'
    dependsOn 'verifyShipShell'
}

