// Safety net of the hexagonal migration (docs/architecture/hexagonal-migration.md, sections 3 and 11).
// Golden masters live in src/test/resources/golden and are frozen: -PgoldenRecord rewrites them (S0 only).
def goldenRecord = providers.gradleProperty('goldenRecord').isPresent()
def goldenDir = file('src/test/resources/golden')
// S6 reconciled with released main: ship/runtime adapters remain legacy; all migrated domain rules stay pure.
// See the merge reconciliation note in the migration document; the task prepends the classes and source root.
def architectureArgs = ['--max-legacy', '56', '--min-domain', '65', '--min-application', '0', '--min-adapter', '5']

tasks.register('verifyArchitecture', JavaExec) {
    dependsOn tasks.named('classes'), tasks.named('testClasses')
    classpath = sourceSets.test.output.classesDirs
    mainClass = 'dev.hurtify.relicsaddon.contract.ArchitectureCheck'
    args([layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath,
          '--sources', file('src/main/java/dev/hurtify/relicsaddon').absolutePath] + architectureArgs)
}

// Resource bytes and the string constants of the compiled mod (ids, keys, messages) against their goldens.
tasks.register('verifyContracts', JavaExec) {
    dependsOn tasks.named('classes'), tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.hurtify.relicsaddon.contract.ContractCheck'
    args '--root', projectDir.absolutePath, '--golden', goldenDir.absolutePath,
            '--resources', file('src/main/resources').absolutePath, '--resources', file('src/generated/resources').absolutePath,
            '--classes', layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath
    if (goldenRecord) args '--record'
}

// Classes named only in strings (the reflective client hook, the LambDynamicLights entrypoint) must resolve.
tasks.register('verifyEntrypoints', JavaExec) {
